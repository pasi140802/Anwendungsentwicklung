[project]
name = "courtslot"
version = "0.1.0"
description = "Buchungsplattform für Padel- und Tennisvereine (Prototyp, FOM-Projekt Anwendungsentwicklung)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI nutzt Depends()/Form() bewusst als Default-Argumente.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Von Alembic erzeugte Migrationen bleiben im generierten Format.
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
