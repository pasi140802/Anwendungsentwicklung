# Lokaler Start mit einem Befehl (NFA-10):  docker compose up --build
#   App:    http://localhost:8000   (Demo-Konten siehe README)
#   Mails:  http://localhost:8025   (Mailpit fängt alle Mails ab, z. B. Bestätigungslinks)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: courtslot
      POSTGRES_PASSWORD: courtslot
      POSTGRES_DB: courtslot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtslot"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  # Schema per Migration auf Stand bringen, danach Demo-Daten (nur in leerer DB)
  migrate:
    build: .
    command: ["python", "-m", "scripts.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://courtslot:courtslot@db:5432/courtslot
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://courtslot:courtslot@db:5432/courtslot
      SECRET_KEY: ${SECRET_KEY:-lokaler-demo-schluessel-bitte-aendern}
      BASE_URL: http://localhost:8000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  pgdata:
