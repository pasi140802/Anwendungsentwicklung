{% extends "base.html" %}
{% block title %}Anmelden · CourtSlot{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Anmelden</h1>
  <p class="muted">Platzbuchung für Vereinsmitglieder</p>
  {% if error %}<p class="flash flash-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>E-Mail-Adresse <input type="email" name="email" value="{{ email or '' }}" required autocomplete="username"></label>
    <label>Passwort <input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit" class="primary">Anmelden</button>
  </form>
</section>
{% endblock %}
