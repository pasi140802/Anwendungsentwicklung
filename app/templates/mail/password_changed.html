{% extends "mail/_layout.html" %}
{% block body %}
<p>Hallo {{ name }},</p>
<p>dein CourtSlot-Passwort wurde gerade geändert. Andere Geräte wurden abgemeldet.</p>
<p>Warst du das nicht? Leg sofort ein neues Passwort fest.</p>
<p style="margin:24px 0"><a href="{{ link }}" style="display:inline-block;background:#dff04b;color:#0e2350;font-weight:bold;text-decoration:none;padding:12px 20px;border-radius:10px;border:1px solid #c6d82c">Neues Passwort festlegen</a></p>
<p style="font-size:13px;color:#4a5872">Falls der Knopf nicht funktioniert: <a href="{{ link }}" style="color:#1f4e9c;word-break:break-all">{{ link }}</a></p>
{% endblock %}
