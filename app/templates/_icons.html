{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "calendar" -%}
<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
{%- elif name == "ticket" -%}
<path d="M4 7.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2V10a2 2 0 0 0 0 4v2.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V14a2 2 0 0 0 0-4z"/><path d="M14.5 5.5v13" stroke-dasharray="2 2.2"/>
{%- elif name == "court" -%}
<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M4 12h16M7 3v18M17 3v18M7 7.5h10M7 16.5h10M12 7.5v9"/>
{%- elif name == "lock" -%}
<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
{%- elif name == "users" -%}
<circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-6 6.5-6s5.9 2.4 6.5 6"/><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6M18 14.4c1.9.8 3.2 2.8 3.5 5.6"/>
{%- elif name == "rules" -%}
<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
{%- elif name == "chart" -%}
<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>
{%- elif name == "logout" -%}
<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/>
{%- elif name == "left" -%}
<path d="M15 5l-7 7 7 7"/>
{%- elif name == "right" -%}
<path d="M9 5l7 7-7 7"/>
{%- elif name == "check" -%}
<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "alert" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>
{%- elif name == "close" -%}
<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == "settings" -%}
<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/><circle cx="7" cy="18" r="1.6" fill="currentColor"/>
{%- elif name == "plus" -%}
<path d="M12 5v14M5 12h14"/>
{%- elif name == "ball" -%}
<circle cx="12" cy="12" r="8.5"/><path d="M5.2 7.2c3 1.6 3 8 0 9.6M18.8 7.2c-3 1.6-3 8 0 9.6"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro logo() -%}
<svg class="logo-mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
<rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="var(--court)" stroke="var(--line-on-court)" stroke-width="1.5"/>
<path d="M8 5.5v21M24 5.5v21M8 11.5h16M8 20.5h16M16 11.5v9" stroke="#fff" stroke-width="1.6" fill="none"/>
<circle cx="21" cy="8" r="3.4" fill="var(--ball)"/>
</svg>
{%- endmacro %}
