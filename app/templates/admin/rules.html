{% extends "base.html" %}
{% block title %}Buchungsregeln · CourtSlot{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Buchungsregeln</h1>
  <p class="muted">Änderungen gelten für neue Buchungen.</p>
  <form method="post" action="/admin/regeln" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>Höchstzahl aktiver Buchungen pro Mitglied
      <input type="number" name="max_active" min="1" max="20" value="{{ club.max_active_bookings }}" required></label>
    <label>Maximaler Vorlauf in Tagen
      <input type="number" name="max_days" min="1" max="60" value="{{ club.max_days_ahead }}" required></label>
    <button type="submit" class="primary">Speichern</button>
  </form>
</section>
{% endblock %}
