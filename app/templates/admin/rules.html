{% extends "base.html" %}
{% block title %}Buchungsregeln – CourtSlot{% endblock %}
{% block content %}
{% set active = "regeln" %}{% include "admin/_nav.html" %}
<section class="panel">
  <div class="panel-head">
    <h2>Buchungsregeln</h2>
    <p>Damit beliebte Abendzeiten fair verteilt werden. Änderungen gelten für neue Buchungen.</p>
  </div>
  <form method="post" action="/admin/regeln" class="panel-body rules">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label class="field">Aktive Buchungen pro Mitglied
      <small>Wie viele kommende Spiele ein Mitglied gleichzeitig gebucht haben darf.</small>
      <span class="stepper"><input type="number" name="max_active" min="1" max="20" value="{{ club.max_active_bookings }}" required></span>
    </label>
    <label class="field">Vorlauf in Tagen
      <small>Wie weit im Voraus gebucht werden kann.</small>
      <span class="stepper"><input type="number" name="max_days" min="1" max="60" value="{{ club.max_days_ahead }}" required></span>
    </label>
    <div><button type="submit" class="btn btn-court">Regeln speichern</button></div>
  </form>
</section>
{% endblock %}
