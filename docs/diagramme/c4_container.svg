="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="98" x="370" y="356.373">HTTP-Anfragen</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="166" x="336" y="372.1025">(HTML-Fragmente zurück)</text><!--link APP to DB--><path d="M324.65,527.7893 C310.83,555.1193 294.39,587.6293 280.04,615.9993 " fill="none" id="APP-DB" style="stroke: #13261F; stroke-width: 1.0;"/><polygon fill="#13261F" points="277.76,620.5093,285.3946,614.2873,280.0189,616.0487,278.2575,610.673,277.76,620.5093" style="stroke: #13261F; stroke-width: 1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="115" x="327.5" y="571.373">SQL über psycopg</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="156" x="307" y="587.1025">(Transaktionen, Sperren)</text><!--link SEED to DB--><path d="M142.44,511.0093 C160.09,541.0093 183.99,581.6093 204.27,616.0693 " fill="none" id="SEED-DB" style="stroke: #13261F; stroke-width: 1.0;"/><polygon fill="#13261F" points="206.98,620.6793,205.866,610.8936,204.4455,616.3693,198.9699,614.9488,206.98,620.6793" style="stroke: #13261F; stroke-width: 1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="25" x="189" y="579.373">SQL</text><!--
@startuml c4_container
title CourtSlot - Container (C4 Ebene 2)
skinparam shadowing false
skinparam ArrowColor #13261F
skinparam defaultFontName Arial
skinparam rectangle {
  BorderColor #13261F
  BackgroundColor #FFFFFF
}
skinparam databaseBorderColor #13261F
skinparam databaseBackgroundColor #FFFFFF
skinparam actorBorderColor #13261F
skinparam actorBackgroundColor #FFFFFF

actor "Mitglied / Admin" as U

rectangle "CourtSlot" as SYS {
  rectangle "Browser-Oberfläche\n[HTML, CSS, HTMX]\n\nWochenkalender, Formulare;\nlädt Teilansichten nach" as UI
  rectangle "Web-Anwendung\n[Python 3.13, FastAPI, Jinja2]\n\nRouten, Sitzung, CSRF, Rollen;\nBookingService und AdminService\nmit allen Buchungsregeln" as APP #F6F5EF
  database "Datenbank\n[PostgreSQL 16]\n\nVereine, Benutzer, Plätze,\nBuchungen, Sperren;\nUnique-Index gegen Doppelbuchung" as DB
  rectangle "Demo-Daten-Skript\n[Python]\n\nlegt Beispielverein an" as SEED
}

U - -> UI : HTTPS
UI - -> APP : HTTP-Anfragen\n(HTML-Fragmente zurück)
APP - -> DB : SQL über psycopg\n(Transaktionen, Sperren)
SEED - -> DB : SQL
@enduml

