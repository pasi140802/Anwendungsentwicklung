0" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="93" x="278.5" y="402.373">sendet E-Mails</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="71" x="289.5" y="418.1025">(SMTP/API)</text><!--link VV to CS--><path d="M505.85,131.0493 C502.01,159.1593 492.58,198.1493 469.5,223.7793 C454.29,240.6693 435,254.1693 414.55,264.9393 " fill="none" id="VV-CS" style="stroke: #13261F; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#13261F" points="409.89,267.3293,419.7229,266.7689,414.3361,265.0419,416.0631,259.6551,409.89,267.3293" style="stroke: #13261F; stroke-width: 1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="135" x="489.5" y="204.373">liefert Mitgliederlisten</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="62" x="526" y="220.1025">(CSV/API)</text><!--
@startuml c4_kontext
title CourtSlot - Systemkontext (C4 Ebene 1)
skinparam shadowing false
skinparam ArrowColor #13261F
skinparam defaultFontName Arial
skinparam rectangle {
  BorderColor #13261F
}
skinparam rectangle<<system>> {
  BackgroundColor #13261F
  FontColor #F6F5EF
  StereotypeFontColor #13261F
}
hide stereotype
skinparam actorBorderColor #13261F
skinparam actorBackgroundColor #FFFFFF

actor "Mitglied\n[Person]\nsieht Belegung, bucht\nund storniert Slots" as M
actor "Platzwart / Admin\n[Person]\nverwaltet Plätze, Sperren,\nRegeln und Mitglieder" as A

rectangle "CourtSlot\n[Software-System]\n\nmandantenfähige Buchungsplattform\nfür Tennis- und Padelvereine" <<system>> as CS

rectangle "E-Mail-Dienst\n[externes System, Ausblick]\nBuchungsbestätigungen" as MAIL #ECEBE2
rectangle "Vereinsverwaltung\n[externes System, Ausblick]\nMitgliederimport" as VV #ECEBE2

M - -> CS : nutzt per Browser\n(Smartphone/PC), HTTPS
A - -> CS : verwaltet per Browser, HTTPS
CS ..> MAIL : sendet E-Mails\n(SMTP/API)
VV ..> CS : liefert Mitgliederlisten\n(CSV/API)
@enduml

