yphs" textLength="36" x="186" y="386.373">SMTP</text><!--link CS to PAY--><path d="M275.21,343.1993 C292.27,369.0993 312.56,399.8893 328.28,423.7493 " fill="none" id="CS-PAY" style="stroke: #0E1B33; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#0E1B33" points="331.16,428.1193,329.5576,418.4017,328.413,423.9415,322.8731,422.7969,331.16,428.1193" style="stroke: #0E1B33; stroke-width: 1.0;"/><text fill="#0E1B33" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="88" x="305" y="386.373">API (Option B)</text><!--
@startuml c4_kontext
title CourtSlot - Systemkontext (C4 Ebene 1)
skinparam shadowing false
skinparam ArrowColor #0e1b33
skinparam defaultFontName Arial
skinparam defaultFontColor #0e1b33
skinparam rectangle {
  BorderColor #0e1b33
}
skinparam rectangle<<system>> {
  BackgroundColor #1f4e9c
  FontColor #FFFFFF
  BorderColor #1f4e9c
}
hide stereotype
skinparam actorBorderColor #0e1b33
skinparam actorBackgroundColor #FFFFFF

actor "Spieler / Mitglied\n[Person]\nregistriert sich, tritt Vereinen bei,\nbucht und storniert" as M
actor "Verwaltung\n[Person]\npflegt Plätze, Preise, Regeln,\nMitglieder und Sperren" as A

rectangle "CourtSlot\n[Software-System]\n\nmandantenfähige Buchungsplattform\nfür Tennis- und Padelanlagen" <<system>> as CS

rectangle "E-Mail-Dienst\n[externes System]\nBestätigung, Einladung,\nBuchung, Passwort" as MAIL #FFFFFF
rectangle "Zahlungsdienst\n[externes System, Ausblick]\nOnline-Zahlung" as PAY #edf1f6

M - -> CS : Browser (Smartphone/PC), HTTPS
A - -> CS : Browser, HTTPS
CS - -> MAIL : SMTP
CS ..> PAY : API (Option B)
@enduml

