ngAndGlyphs" textLength="148" x="635" y="250.373">Mitgliedschaft gesperrt,</text><text fill="#0E1B33" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="183" x="617.5" y="266.1025">beendet oder Konto gelöscht</text><!--link Bestaetigt to Stattgefunden--><path d="M371.76,180.9093 C323.52,183.7693 234.7,193.7893 168.5,228.7793 C129.84,249.2093 95.45,287.3493 75.8,312.0093 " fill="none" id="Bestaetigt-Stattgefunden" style="stroke: #0E1B33; stroke-width: 1.0;"/><polygon fill="#0E1B33" points="72.54,316.1493,81.2552,311.5619,75.6373,312.2242,74.975,306.6062,72.54,316.1493" style="stroke: #0E1B33; stroke-width: 1.0;"/><text fill="#0E1B33" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="118" x="169.5" y="258.373">Slotbeginn erreicht</text><!--link Storniert to *end--><path d="M502.43,355.4093 C496.48,358.5793 490.33,361.8093 484.5,364.7793 C441.45,386.6893 430.45,391.7293 386.5,411.7793 C359.82,423.9493 328.32,437.3893 310.55,444.8893 " fill="none" id="Storniert-*end" style="stroke: #0E1B33; stroke-width: 1.0;"/><polygon fill="#0E1B33" points="305.49,447.0193,315.3369,447.2133,310.0982,445.079,312.2325,439.8402,305.49,447.0193" style="stroke: #0E1B33; stroke-width: 1.0;"/><!--link Stattgefunden to *end--><path d="M98.6,356.4093 C153.15,382.4193 247.95,427.6293 282.98,444.3293 " fill="none" id="Stattgefunden-*end" style="stroke: #0E1B33; stroke-width: 1.0;"/><polygon fill="#0E1B33" points="287.71,446.5893,281.3141,439.0998,283.1986,444.4335,277.8649,446.318,287.71,446.5893" style="stroke: #0E1B33; stroke-width: 1.0;"/><text fill="#0E1B33" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="163" x="214.5" y="408.373">nach 12 Monaten gelöscht</text><!--
@startuml zustand_buchung
title CourtSlot - Zustandsdiagramm einer Buchung
skinparam shadowing false
skinparam ArrowColor #0e1b33
skinparam defaultFontName Arial
skinparam defaultFontColor #0e1b33
skinparam state {
  BackgroundColor #FFFFFF
  BorderColor #1f4e9c
}
skinparam noteBackgroundColor #f6fbd2
skinparam noteBorderColor #c6d82c
hide empty description

[*] - -> Bestaetigt : buchen\n[Slot frei, im Raster, Regeln erfüllt,\nPlatz nicht gesperrt]

state "Bestätigt" as Bestaetigt
state "Storniert" as Storniert
state "Stattgefunden" as Stattgefunden

Bestaetigt - -> Storniert : stornieren\n[Mitglied: vor Stornofrist;\nVerwaltung: vor Beginn]
Bestaetigt - -> Storniert : Sperre bestätigt
Bestaetigt - -> Storniert : Mitgliedschaft gesperrt,\nbeendet oder Konto gelöscht
Bestaetigt - -> Stattgefunden : Slotbeginn erreicht

Storniert - -> [*]
Stattgefunden - -> [*] : nach 12 Monaten gelöscht

note right of Stattgefunden
  Wird nicht gespeichert, sondern aus
  status = bestätigt und startAt <= jetzt abgeleitet.
  Zählt nicht mehr als aktive Buchung.
end note
note right of Storniert
  Slot ist sofort wieder frei.
end note
@enduml

