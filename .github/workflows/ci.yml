name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: courtslot
          POSTGRES_PASSWORD: courtslot
          POSTGRES_DB: courtslot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courtslot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://courtslot:courtslot@localhost:5432/courtslot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Linter
        run: ruff check app tests scripts
      - name: Tests mit Abdeckung
        run: pytest --cov=app --cov-report=term --cov-fail-under=80

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Container-Image bauen
        run: docker build -t courtslot:${{ github.sha }} .
